<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARUNG MAKAN AA NOPAL</title>
<style>
  :root{ --cream:#fff8ea; --paper:#fffdf8; --brown:#5a2d1b; --brown2:#7a3f24; --red:#c9472d; --gold:#e9a83b; --green:#49683a; --shadow:0 18px 50px rgba(75,39,20,.13); }
  *{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth}
  body{ font-family:Inter,system-ui,sans-serif; color:var(--brown); background:var(--cream); line-height:1.6; overflow-x:hidden; }
  a{text-decoration:none;color:inherit} .container{width:min(1120px,92%);margin:auto}
  .float{position:fixed;z-index:-1;opacity:.16;pointer-events:none;animation:drift 7s ease-in-out infinite}
  .float.one{top:20%;left:2%;font-size:42px} .float.two{top:62%;right:2%;font-size:46px;animation-delay:1.5s} .float.three{bottom:5%;left:7%;font-size:34px;animation-delay:3s}
  @keyframes drift{50%{transform:translateY(-18px) rotate(7deg)}}
  header{ position:fixed;top:0;left:0;right:0;z-index:1000; background:rgba(255,253,248,.88); backdrop-filter:blur(16px); border-bottom:1px solid rgba(90,45,27,.08); }
  .nav{ min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px }
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.4px}
  .brand-icon{ width:43px;height:43px;border-radius:14px;display:grid;place-items:center; background:linear-gradient(135deg,var(--red),var(--gold));color:white; box-shadow:0 8px 20px rgba(201,71,45,.25);font-size:22px }
  .brand span{display:block} .brand small{display:block;font-size:10px;letter-spacing:2px;color:#9b735f;font-weight:700}
  .nav-links{display:flex;gap:7px;align-items:center}
  .nav-links a{ padding:10px 14px;border-radius:999px;font-size:14px;font-weight:750; transition:.25s ease }
  .nav-links a:hover{background:#fff0d1;color:var(--red);transform:translateY(-2px)}
  .nav-toggle{display:none;border:0;background:transparent;font-size:28px;color:var(--brown)}
  section{padding:100px 0} #beranda{padding-top:145px}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:50px;min-height:610px}
  .eyebrow{ display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px; background:#fff0d4;color:var(--brown2);font-size:13px;font-weight:800;margin-bottom:18px; }
  h1{ font-family:Georgia,serif;font-size:clamp(46px,6vw,78px);line-height:.98; color:var(--brown);letter-spacing:-3px } h1 span{color:var(--red)}
  .hero p{font-size:18px;color:#765a4b;max-width:590px;margin:22px 0 30px}
  .actions{display:flex;gap:13px;flex-wrap:wrap}
  .btn{ display:inline-flex;align-items:center;justify-content:center;gap:9px; border:0;border-radius:16px;padding:14px 20px;font-weight:850;cursor:pointer; transition:transform .25s ease,box-shadow .25s ease; }
  .btn:hover{transform:translateY(-4px);box-shadow:0 13px 28px rgba(90,45,27,.16)}
  .btn-primary{background:var(--red);color:white} .btn-secondary{background:white;color:var(--brown);border:1px solid #eadac6}
  .hero-card{ position:relative;min-height:480px;border-radius:34px;overflow:hidden; background:linear-gradient(145deg,#7c3e25,#4e271a); box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center; }
  .hero-plate{ width:74%;aspect-ratio:1;border-radius:50%;background:#fffaf1; border:13px solid #f1dfc6;box-shadow:0 30px 55px rgba(0,0,0,.24); display:grid;place-items:center;position:relative;animation:plate 6s ease-in-out infinite }
  .hero-plate::before{content:"";position:absolute;inset:12%;border-radius:50%;border:2px dashed #e8cda5}
  .food-art{font-size:125px;filter:drop-shadow(0 14px 10px rgba(0,0,0,.2));z-index:2}
  .leaf{position:absolute;font-size:40px;animation:spinFloat 5s ease-in-out infinite} .leaf.a{top:9%;left:12%}.leaf.b{bottom:12%;right:10%;animation-delay:1s}
  @keyframes plate{50%{transform:translateY(-10px) rotate(1deg)}} @keyframes spinFloat{50%{transform:translateY(-12px) rotate(-8deg)}}
  .section-head{text-align:center;max-width:720px;margin:0 auto 45px} .section-head .tag{color:var(--red);font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
  h2{font-family:Georgia,serif;font-size:clamp(34px,4vw,50px);line-height:1.1;margin:8px 0 12px} .section-head p{color:#7d6455}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{ background:rgba(255,253,248,.85);border:1px solid #eedfcf;border-radius:24px;padding:25px; box-shadow:0 10px 35px rgba(75,39,20,.07);transition:.3s ease }
  .card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
  .icon{ width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:25px; background:#fff0d4;margin-bottom:16px }
  .card h3{font-size:19px;margin-bottom:7px} .card p{color:#7d6455;font-size:14px}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .menu-card{background:white;border-radius:23px;overflow:hidden;border:1px solid #efdfce;transition:.3s} .menu-card:hover{transform:translateY(-7px);box-shadow:var(--shadow)}
  .food-photo{ height:190px;display:grid;place-items:center; background:linear-gradient(135deg,#f5d49b,#f9ecd2);font-size:85px }
  .menu-body{padding:19px} .menu-body h3{display:flex;justify-content:space-between;gap:12px;font-size:18px} .price{color:var(--red);white-space:nowrap} .menu-body p{font-size:13px;color:#80685a;margin-top:5px}
  /* FORM ORDER BARU */
  .order-wrapper{ background:white; border:1px solid #efdfce; border-radius:28px; padding:35px; box-shadow:var(--shadow); display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start; }
  .order-form{ display:flex; flex-direction:column; gap:14px; }
  .order-form input, .order-form textarea, .order-form select{ width:100%; padding:14px 16px; border-radius:14px; border:1px solid #e9d9c3; background:#fffdf8; font-family:inherit; font-size:14px; outline:none; }
  .order-form input:focus, .order-form textarea:focus{ border-color:var(--red); box-shadow:0 0 0 4px rgba(201,71,45,.12); }
  .split{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:stretch}
  .facility{ background:var(--brown);color:white;border-radius:28px;padding:35px;position:relative;overflow:hidden }
  .facility::after{content:"🍛";position:absolute;font-size:170px;right:-25px;bottom:-50px;opacity:.09}
  .facility h2{color:white} .facility p{color:#e8d7ca}
  .facility-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}
  .facility-list div{padding:13px;border-radius:14px;background:rgba(255,255,255,.09);font-size:14px}
  .contact{ background:linear-gradient(135deg,#fff,#fff3db);border:1px solid #ead7c1;border-radius:28px;padding:35px }
  .contact-row{display:flex;gap:15px;align-items:flex-start;padding:16px 0;border-bottom:1px solid #eadcca} .contact-row:last-child{border:0}
  .contact-row .icon{flex:0 0 50px;margin:0} .contact-row small{display:block;color:#967a68;margin-bottom:2px} .contact-row a{font-weight:800;color:var(--brown2);word-break:break-word}
  .cta{ margin-top:35px;padding:30px;border-radius:27px;background:linear-gradient(120deg,var(--red),#a93621); color:white;display:flex;justify-content:space-between;align-items:center;gap:25px;overflow:hidden }
  .cta h3{font-family:Georgia,serif;font-size:29px} .cta p{opacity:.88;margin-top:5px} .cta .btn{background:white;color:var(--red);flex-shrink:0}
  footer{padding:30px 0;background:#3e2116;color:#ead8cc;margin-top:30px} footer .footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:13px} footer strong{color:white}
  .popup{ position:fixed;inset:0;background:rgba(35,18,10,.52);backdrop-filter:blur(6px); display:flex;align-items:center;justify-content:center;padding:20px;z-index:2000; opacity:0;visibility:hidden;transition:.3s ease } .popup.show{opacity:1;visibility:visible}
  .popup-box{ width:min(480px,100%);background:#fffdf8;border-radius:28px;padding:30px; box-shadow:0 30px 80px rgba(0,0,0,.28);transform:translateY(25px) scale(.97); transition:.4s cubic-bezier(.2,.8,.2,1);position:relative } .popup.show .popup-box{transform:translateY(0) scale(1)}
  .close{ position:absolute;right:15px;top:13px;width:38px;height:38px;border-radius:50%; border:0;background:#f5e8d5;color:var(--brown);font-size:23px;cursor:pointer }
  .popup-icon{font-size:46px;margin-bottom:7px} .popup-box h3{font-family:Georgia,serif;font-size:31px} .popup-box p
